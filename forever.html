<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forever Love</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, rgb(241, 123, 142), rgb(247, 105, 128));
      color: white;
      font-family: 'Poppins', sans-serif;
      text-align: center;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      animation: fadeIn 2s;
      position: relative;
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }

    h1 {
      font-size: 60px;
      z-index: 2;
    }

    p {
      font-size: 20px;
      max-width: 500px;
      z-index: 2;
    }

    /* Heart animation */
    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: white;
      transform: rotate(-45deg);
      animation: floatUp 5s linear infinite;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: white;
      border-radius: 50%;
    }

    .heart::before {
      top: -10px;
      left: 0;
    }

    .heart::after {
      top: 0;
      left: 10px;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(-45deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-800px) rotate(-45deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <h1>Enta Anandhueyyy❤️</h1>
  
  <p>"I know, you’ve been through some low days too, but everything will be fine. I’m always by your side, now and always…  
    love you more mah boyyyy ummmmmaaahhhhhhhhhh
  </p>
  
  <h1>FOREVER YOURS BABY GIRL</h1>
  <p>by lechu</p>

  <script>
    function createHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.style.left = Math.random() * window.innerWidth + 'px';
      const size = 15 + Math.random() * 25; // random size
      heart.style.width = size + 'px';
      heart.style.height = size + 'px';
      heart.style.animationDuration = 3 + Math.random() * 5 + 's';
      heart.style.backgroundColor = 'pink';
      heart.style.zIndex = 1; // behind text
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 8000);
    }

    setInterval(createHeart, 300);
  </script>
</body>
</html>
